name: Link checker

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"  # Weekly Monday 9am
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --base "https://aevyra.mintlify.app"
            --exclude "localhost"
            --exclude "test.pypi.org"
            --no-ignore-case
            --method GET
            --accept 200
            '**/*.mdx'
          fail: true
